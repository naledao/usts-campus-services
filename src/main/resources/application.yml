spring:
  application:
    name: usts-campus-services

  redis:
    redisson:
      file: classpath:redisson.yml

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  rabbitmq:
    exchange: usts.direct.exchange
    queue: usts.default.queue
    routing-key: usts.default.routing

  # Optional default from address for emails
  mail:
    from: ${MAIL_FROM:}
