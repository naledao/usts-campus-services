syntax = "proto3";
package dianfei;

service DianFeiService {
  rpc QueryCurrentElectricity (QueryRequest) returns (QueryReply);
}

message QueryRequest {
  string campus    = 1;
  string building  = 2;
  string room      = 3;
  string feeitemid = 4;
  string type      = 5;
  string level     = 6;
}

message QueryReply {
  double value = 1;
}
