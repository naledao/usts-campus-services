name: Build backend image

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: naledao/usts-campus-services

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, backend-deploy]

    steps:
      - name: Deploy to Kubernetes
        run: |
          kubectl set image \
            deployment/campus-network-server \
            campus-network-server=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n campus-services

          if ! kubectl rollout status \
            deployment/campus-network-server \
            -n campus-services \
            --timeout=600s; then
            kubectl get pods -n campus-services -l app=campus-network-server -o wide
            kubectl describe deployment campus-network-server -n campus-services
            exit 1
          fi
